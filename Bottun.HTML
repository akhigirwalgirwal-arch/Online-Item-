<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1d2671, #c33764);
        }

        .login-box {
            width: 350px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .login-box h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .welcome {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-box {
            position: relative;
            margin-bottom: 25px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 5px;
            border: none;
            border-bottom: 2px solid #aaa;
            outline: none;
            font-size: 16px;
        }

        .input-box label {
            position: absolute;
            left: 5px;
            top: 12px;
            color: #777;
            pointer-events: none;
            transition: 0.3s;
        }

        .input-box input:focus ~ label,
        .input-box input:valid ~ label {
            top: -10px;
            font-size: 13px;
            color: #1d2671;
        }

        .input-box input:focus {
            border-bottom: 2px solid #1d2671;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 25px;
            background: #1d2671;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c33764;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>
        <p class="welcome">Welcome Back!</p>

        <form id="loginForm">

            <div class="input-box">
                <input type="text" id="username" required>
                <label>Username</label>
            </div>

            <div class="input-box">
                <input type="password" id="password" required>
                <label>Password</label>
            </div>

            <button type="submit">Login</button>

            <p id="message"></p>

        </form>

    </div>

    <script>

        // Users
        const users = {
            "Ajay Girwal": "12345",
            "Arjun Girwal": "123",
        };

        // Login Form
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            // Username aur Password check
            if (users[username] === password) {

                message.style.color = "green";
                message.innerHTML = "Login Successful ✅";

                // Successful Login ke baad website open hogi
                setTimeout(function() {
                    window.location.href = "file:///C:/Users/LENOVO/Desktop/Web%20Side%20Devlop%20file/Apni%20Kaksha.HTML";
                }, 1000);

            } else {

                message.style.color = "red";
                message.innerHTML = "Wrong Username or Password ❌";

            }

        });

    </script>

</body>
</html>
